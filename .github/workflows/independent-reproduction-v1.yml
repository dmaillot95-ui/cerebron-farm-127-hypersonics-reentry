name: F127 Verification Stage
on:
  workflow_dispatch:
  push:
    paths: ['runtime/independent_reproduction_v1.py','.github/workflows/independent-reproduction-v1.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python runtime/independent_reproduction_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: f127-verification-stage
          path: artifacts/f127_independent_reproduction.json
