name: F127 PhysicsNeMo Physics V3
on:
  workflow_dispatch:
  push:
    paths: ['runtime/physicsnemo_physics_v3.py','.github/workflows/physicsnemo-physics-v3.yml']
permissions:
  contents: read
jobs:
  physics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check nvidia-physicsnemo
      - run: python runtime/physicsnemo_physics_v3.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f127-physicsnemo-physics-v3
          path: artifacts/f127_physicsnemo_physics_v3.json
