name: F127 Reference Suite V2
on:
  workflow_dispatch:
  push:
    paths: ['runtime/reference_suite_v2.py','.github/workflows/reference-suite-v2.yml']
permissions:
  contents: read
jobs:
  reference-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python runtime/reference_suite_v2.py
      - uses: actions/upload-artifact@v4
        with:
          name: f127-reference-suite-v2
          path: artifacts/f127_reference_suite.json
